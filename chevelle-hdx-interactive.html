<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="72 Chevelle">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Refined offline build guide for installing Dakota Digital HDX gauges in a 1972 Chevelle SS.">
<title>1972 Chevelle SS — HDX Build Guide</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
@font-face{font-family:'Geist';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/geist-400.woff2') format('woff2');}
@font-face{font-family:'Geist';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/geist-500.woff2') format('woff2');}
@font-face{font-family:'Geist';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/geist-600.woff2') format('woff2');}
@font-face{font-family:'Geist';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/geist-700.woff2') format('woff2');}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/geist-mono-400.woff2') format('woff2');}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/geist-mono-500.woff2') format('woff2');}
@font-face{font-family:'Geist Mono';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/geist-mono-600.woff2') format('woff2');}

/* ============================================================
   REFINED DESIGN SYSTEM — Chevelle HDX Build Guide
   Clean modern utility. Graphite neutrals, single orange accent.
   ============================================================ */
:root {
  --accent: #ff6a2b;           /* signature orange (tweakable) */
  --accent-ink: #ffffff;
  --good: #3fb950;
  --warn: #e0a13a;
  --bad: #f0533f;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px;
  --rail-w: 248px;
  --topbar-h: 64px;
  --gap: 20px;
  --ease: cubic-bezier(.2,.7,.3,1);
  --shadow: 0 1px 2px rgba(0,0,0,.18), 0 8px 28px -12px rgba(0,0,0,.4);
  --fs-base: 16px;
  --pad: 16px;       /* density-controlled */
  --maxw: 1640px;
}
html[data-theme="dark"] {
  --bg: #0f1115;
  --bg-2: #14171d;
  --surface: #181b22;
  --surface-2: #1f232c;
  --surface-3: #262b35;
  --line: #282d38;
  --line-strong: #39404d;
  --text: #edeff3;
  --text-2: #a7adba;
  --text-3: #727988;
  --accent-soft: color-mix(in oklab, var(--accent) 16%, transparent);
  --accent-line: color-mix(in oklab, var(--accent) 36%, transparent);
  --glass: rgba(15,17,21,.78);
  --photo-tint: #0b0d11;
}
html[data-theme="light"] {
  --bg: #f1efe9;
  --bg-2: #e9e6de;
  --surface: #ffffff;
  --surface-2: #f7f5f0;
  --surface-3: #efece4;
  --line: #e3ded3;
  --line-strong: #d3ccbd;
  --text: #20242b;
  --text-2: #5a606b;
  --text-3: #8b909b;
  --good: #1f8a4c;
  --warn: #b07d12;
  --bad: #c8412b;
  --accent-soft: color-mix(in oklab, var(--accent) 14%, white);
  --accent-line: color-mix(in oklab, var(--accent) 40%, transparent);
  --glass: rgba(241,239,233,.8);
  --photo-tint: #d8d2c6;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family:'Geist', system-ui, -apple-system, sans-serif;
  background:var(--bg); color:var(--text);
  font-size:var(--fs-base); line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
.mono { font-family:'Geist Mono', ui-monospace, monospace; font-feature-settings:"tnum" 1; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:8px; border:2px solid var(--bg); }
::-webkit-scrollbar-track { background:transparent; }
button { font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
a { color:var(--accent); text-decoration:none; }

/* ===== APP SHELL ===== */
#root, #app { height:100%; }
.app { display:grid; grid-template-columns:var(--rail-w) 1fr; height:100%; }
.app.rail-collapsed { grid-template-columns:76px 1fr; }

/* ===== LEFT RAIL ===== */
.rail { background:var(--bg-2); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.rail-head { display:flex; align-items:center; gap:12px; padding:18px 18px 14px; }
.rail-mark { width:38px; height:38px; border-radius:10px; flex-shrink:0; display:grid; place-items:center;
  background:linear-gradient(150deg, var(--accent), color-mix(in oklab, var(--accent) 60%, #b3401a)); box-shadow:var(--shadow); }
.rail-mark svg { width:24px; height:24px; }
.rail-title { min-width:0; }
.rail-title .t1 { font-weight:700; font-size:14.5px; letter-spacing:-.01em; white-space:nowrap; }
.rail-title .t2 { font-size:11px; color:var(--text-3); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.app.rail-collapsed .rail-title, .app.rail-collapsed .rail-group-label, .app.rail-collapsed .nav-item .lbl,
.app.rail-collapsed .nav-item .nv-meta, .app.rail-collapsed .rail-progress-wrap { display:none; }
.app.rail-collapsed .rail-head { justify-content:center; padding:18px 0 14px; }

.rail-progress-wrap { padding:4px 18px 14px; }
.rail-progress-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
.rail-progress-top .rp-pct { font-size:20px; font-weight:700; letter-spacing:-.02em; }
.rail-progress-top .rp-lab { font-size:11px; color:var(--text-3); letter-spacing:.05em; text-transform:uppercase; }
.rail-progress-bar { height:7px; border-radius:6px; background:var(--surface-3); overflow:hidden; }
.rail-progress-fill { height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent), color-mix(in oklab,var(--accent) 55%,#ffd0a8)); transition:width .5s var(--ease); }

.rail-nav { flex:1; overflow-y:auto; padding:6px 12px 16px; min-height:0; }
.rail-group-label { font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); padding:14px 10px 6px; }
.nav-item { display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border-radius:10px; color:var(--text-2);
  font-size:14.5px; font-weight:500; transition:background .15s, color .15s; position:relative; min-height:44px; }
.app.rail-collapsed .nav-item { justify-content:center; padding:10px 0; }
.nav-item:hover { background:var(--surface-2); color:var(--text); }
.nav-item.active { background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 1px var(--line); }
.nav-item.active::before { content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:22px; border-radius:0 3px 3px 0; background:var(--accent); }
.app.rail-collapsed .nav-item.active::before { left:0; }
.nav-item svg { width:20px; height:20px; flex-shrink:0; stroke-width:1.9; }
.nav-item .lbl { flex:1; white-space:nowrap; }
.nv-meta { font-size:11px; font-weight:600; color:var(--text-3); }
.nv-meta.dot-done { color:var(--good); }
.nav-item .nv-ring { flex-shrink:0; }

.rail-foot { padding:10px 14px 16px; border-top:1px solid var(--line); display:flex; gap:8px; }
.rail-foot .ghost-btn { flex:1; }

/* ===== TOPBAR + MAIN ===== */
.work { display:flex; flex-direction:column; min-width:0; min-height:0; }
.topbar { height:var(--topbar-h); flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 22px;
  border-bottom:1px solid var(--line); background:var(--glass); backdrop-filter:blur(14px); }
.tb-collapse { width:38px; height:38px; border-radius:9px; display:grid; place-items:center; color:var(--text-2); }
.tb-collapse:hover { background:var(--surface-2); color:var(--text); }
.tb-title { min-width:0; }
.tb-title h1 { font-size:18px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tb-title .crumb { font-size:11.5px; color:var(--text-3); letter-spacing:.05em; text-transform:uppercase; }
.tb-spacer { flex:1; }
.tb-search { display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  padding:0 12px; height:40px; min-width:210px; color:var(--text-3); transition:border-color .15s; }
.tb-search:hover, .tb-search:focus-within { border-color:var(--line-strong); }
.tb-search svg { width:17px; height:17px; flex-shrink:0; }
.tb-search input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px; min-width:0; }
.tb-search input::placeholder { color:var(--text-3); }
.tb-search kbd { font-size:10.5px; font-family:'Geist Mono',monospace; color:var(--text-3); background:var(--surface-3); border:1px solid var(--line); border-radius:5px; padding:2px 5px; }
.icon-btn { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:var(--text-2); border:1px solid transparent; }
.icon-btn:hover { background:var(--surface-2); color:var(--text); }
.icon-btn svg { width:19px; height:19px; }
.barney-toggle { display:flex; align-items:center; gap:9px; height:40px; padding:0 14px 0 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-2); font-size:13.5px; font-weight:600; color:var(--text-2); transition:.15s; white-space:nowrap; }
.barney-toggle:hover { border-color:var(--line-strong); color:var(--text); }
.barney-toggle.on { background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); }
.barney-toggle .bt-icon { font-size:15px; }
.bt-switch { width:30px; height:17px; border-radius:9px; background:var(--line-strong); position:relative; transition:.2s; flex-shrink:0; }
.barney-toggle.on .bt-switch { background:var(--accent); }
.bt-switch::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:.2s; }
.barney-toggle.on .bt-switch::after { left:15px; }

.scroll { flex:1; overflow-y:auto; min-height:0; }
.page { max-width:var(--maxw); margin:0 auto; padding:26px 28px 80px; }

/* ===== SHARED ATOMS ===== */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); }
.card.pad { padding:var(--pad); }
.section-eyebrow { font-size:11px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--text-3); }
.h-lg { font-size:26px; font-weight:700; letter-spacing:-.025em; }
.h-md { font-size:19px; font-weight:650; letter-spacing:-.02em; }
.muted { color:var(--text-2); }
.faint { color:var(--text-3); }

.stage-tag { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  padding:3px 9px; border-radius:20px; }
.stage-tag .sdot { width:7px; height:7px; border-radius:50%; }

.pill { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; padding:5px 11px; border-radius:8px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--text-2); }
.pill svg { width:14px; height:14px; }

.callout { display:flex; gap:11px; padding:13px 15px; border-radius:var(--r-md); font-size:14px; line-height:1.5; margin:10px 0; }
.callout svg { width:18px; height:18px; flex-shrink:0; margin-top:1px; }
.callout.note { background:color-mix(in oklab,var(--warn) 11%, transparent); border:1px solid color-mix(in oklab,var(--warn) 28%,transparent); color:var(--text); }
.callout.note svg { color:var(--warn); }
.callout.warn { background:color-mix(in oklab,var(--bad) 11%, transparent); border:1px solid color-mix(in oklab,var(--bad) 30%,transparent); }
.callout.warn svg { color:var(--bad); }

/* Barney chip */
.barney { margin:10px 0; border-radius:var(--r-md); border:1px dashed var(--accent-line); background:var(--accent-soft); overflow:hidden; transition:.2s; }
.barney-head { display:flex; align-items:center; gap:10px; padding:11px 14px; width:100%; text-align:left; }
.barney-head .b-i { font-size:16px; }
.barney-head .b-t { flex:1; font-size:13.5px; font-weight:600; color:var(--accent); }
.barney-head .b-c { font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--accent); opacity:.7; text-transform:uppercase; }
.barney-head .b-x { color:var(--accent); transition:transform .2s; }
.barney.open .barney-head .b-x { transform:rotate(90deg); }
.barney-body { display:none; padding:0 15px 14px 40px; font-size:13.5px; color:var(--text); line-height:1.6; }
.barney.open .barney-body { display:block; }

/* progress ring */
.ring { transform:rotate(-90deg); }
.ring-bg { stroke:var(--surface-3); }
.ring-fg { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s var(--ease); }
.ring-done .ring-fg { stroke:var(--good); }

.ghost-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 14px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--text-2); font-size:13.5px; font-weight:600; transition:.15s; }
.ghost-btn:hover { border-color:var(--line-strong); color:var(--text); }
.ghost-btn svg { width:16px; height:16px; }
.solid-btn { display:inline-flex; align-items:center; justify-content:center; gap:9px; height:46px; padding:0 20px; border-radius:11px;
  background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:650; transition:.15s; box-shadow:var(--shadow); }
.solid-btn:hover { filter:brightness(1.06); }
.solid-btn svg { width:18px; height:18px; }

/* ===== HOME ===== */
.home-grid { display:grid; grid-template-columns:1.45fr 1fr; gap:var(--gap); align-items:start; }
.hero-card { padding:0; overflow:hidden; position:relative; }
.hero-photo { position:relative; aspect-ratio:16/7.2; background:var(--photo-tint); }
.hero-photo img { width:100%; height:100%; object-fit:cover; display:block; }
.hero-photo::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, var(--surface) 2%, transparent 55%), linear-gradient(105deg, color-mix(in oklab,var(--surface) 70%, transparent), transparent 60%); }
.hero-meta { position:absolute; left:24px; bottom:18px; right:24px; z-index:2; }
.hero-meta .car { font-size:30px; font-weight:700; letter-spacing:-.03em; }
.hero-meta .sub { color:var(--text-2); font-size:14px; }
.hero-body { padding:20px 24px 24px; }
.resume-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.resume-info { flex:1; min-width:200px; }
.resume-info .rk { font-size:12px; color:var(--text-3); letter-spacing:.05em; text-transform:uppercase; }
.resume-info .rt { font-size:19px; font-weight:650; letter-spacing:-.01em; margin-top:2px; }
.resume-info .rsub { font-size:13px; color:var(--text-2); margin-top:2px; }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:15px 16px; }
.stat .sv { font-size:28px; font-weight:700; letter-spacing:-.03em; }
.stat .sl { font-size:12px; color:var(--text-3); margin-top:1px; letter-spacing:.03em; text-transform:uppercase; }
.stat .sv .unit { font-size:14px; color:var(--text-3); font-weight:600; margin-left:3px; letter-spacing:0; text-transform:none; }

.quick-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:var(--gap); }
.quick { display:flex; flex-direction:column; gap:10px; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); text-align:left; transition:.15s; min-height:88px; }
.quick:hover { border-color:var(--line-strong); background:var(--surface-2); transform:translateY(-1px); }
.quick svg { width:22px; height:22px; color:var(--accent); }
.quick .ql { font-weight:600; font-size:14.5px; }
.quick .qd { font-size:12.5px; color:var(--text-3); }

.timeline-card { margin-top:var(--gap); }
.timeline { display:flex; gap:0; overflow-x:auto; padding:6px 2px 12px; }
.tl-node { flex-shrink:0; width:104px; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; cursor:pointer; }
.tl-node::before { content:''; position:absolute; top:17px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0; }
.tl-node:first-child::before { display:none; }
.tl-node.done::before, .tl-node.cur::before { background:var(--accent); }
.tl-dot { width:34px; height:34px; border-radius:50%; background:var(--surface-2); border:2px solid var(--line); display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--text-3); z-index:1; transition:.2s; }
.tl-node.done .tl-dot { background:var(--good); border-color:var(--good); color:#fff; }
.tl-node.cur .tl-dot { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 0 4px var(--accent-soft); }
.tl-lab { font-size:11px; text-align:center; color:var(--text-3); line-height:1.25; max-width:96px; }
.tl-node.cur .tl-lab, .tl-node.done .tl-lab { color:var(--text-2); }

/* ===== BUILD (two-pane) ===== */
.build-split { display:grid; grid-template-columns:340px 1fr; gap:var(--gap); align-items:start; }
.build-stack .build-split { grid-template-columns:1fr; }
.build-stack .phase-list-card { position:static; }
.phase-list-card { position:sticky; top:0; padding:8px; max-height:calc(100vh - var(--topbar-h) - 52px); overflow-y:auto; }
.pl-item { display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; border-radius:11px; text-align:left; transition:.13s; position:relative; }
.pl-item:hover { background:var(--surface-2); }
.pl-item.active { background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--accent-line); }
.pl-num { width:30px; height:30px; border-radius:8px; flex-shrink:0; display:grid; place-items:center; font-size:13px; font-weight:700;
  background:var(--surface-3); color:var(--text-3); position:relative; }
.pl-num.done { background:var(--good); color:#fff; }
.pl-num.partial { color:var(--accent); }
.pl-body { flex:1; min-width:0; }
.pl-title { font-size:14px; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-item.active .pl-title { font-weight:650; }
.pl-meta { font-size:11.5px; color:var(--text-3); display:flex; gap:8px; align-items:center; }
.pl-crit { color:var(--bad); font-weight:600; }

/* phase detail */
.pd-head { display:flex; align-items:flex-start; gap:16px; margin-bottom:6px; }
.pd-head .pd-n { width:52px; height:52px; border-radius:13px; flex-shrink:0; display:grid; place-items:center; font-size:21px; font-weight:700;
  background:var(--surface-2); border:1px solid var(--line); }
.pd-titles { flex:1; min-width:0; }
.pd-titles h2 { font-size:25px; font-weight:700; letter-spacing:-.025em; line-height:1.12; }
.pd-titles .pd-sub { display:flex; gap:10px; align-items:center; margin-top:7px; flex-wrap:wrap; }
.pd-goal { font-size:15.5px; color:var(--text-2); line-height:1.6; margin:14px 0 18px; max-width:64ch; }
.pd-prog { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:18px; }
.pd-prog .pp-bar { flex:1; height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
.pd-prog .pp-fill { height:100%; border-radius:5px; background:var(--accent); transition:width .4s var(--ease); }
.pd-prog .pp-fill.done { background:var(--good); }
.pd-prog .pp-txt { font-size:13px; font-weight:600; color:var(--text-2); white-space:nowrap; }

.block-label { font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin:22px 0 11px; display:flex; align-items:center; gap:8px; }
.tools-wrap { display:flex; flex-wrap:wrap; gap:8px; }
.kit-bag { background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:var(--r-md); padding:13px 15px; margin-top:6px; }
.kit-bag .kb-t { font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; display:flex; align-items:center; gap:7px; }
.kit-bag .kb-c { font-size:13.5px; color:var(--text-2); line-height:1.55; }

/* substeps */
.substeps { display:flex; flex-direction:column; gap:8px; }
.substep { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); transition:.15s; overflow:hidden; }
.substep.checked { border-color:color-mix(in oklab,var(--good) 35%, var(--line)); background:color-mix(in oklab,var(--good) 5%, var(--surface)); }
